<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão de curso</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f3f4f6; }
  .curso { position: relative; width: 300px; height: 200px; margin: auto;
    border-radius: 16px; overflow: hidden; }
  .curso img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camada { position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(transparent 30%, rgba(0,0,0,.75)); }
  .selo { position: absolute; top: 12px; right: 12px; z-index: 3;
    background: #ef4444; color: #fff; padding: 4px 10px; border-radius: 99px; font-size: .8rem; }
  .titulo { position: absolute; left: 16px; bottom: 16px; z-index: 2; color: #fff; margin: 0; }
</style>
</head>
<body>
  <div class="curso">
    <img src="https://picsum.photos/seed/css/600/400" alt="">
    <div class="camada"></div>
    <span class="selo">Novo</span>
    <h2 class="titulo">Curso de CSS</h2>
  </div>
</body>
</html>
