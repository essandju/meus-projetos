<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartões de notícias</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f3f4f6; }
  .lista { display: flex; gap: 16px; max-width: 900px; margin: auto; }
  .cartao { flex: 1; display: flex; flex-direction: column; gap: 12px;
    background: #fff; padding: 16px; border-radius: 12px; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
  .etiquetas span { background: #e0e7ff; padding: 2px 8px; border-radius: 99px; font-size: .75rem; }
  .cartao p { margin: 0; }
  .cartao button { margin-top: auto; padding: 8px; border: 0; border-radius: 8px;
    background: #6366f1; color: #fff; }
</style>
</head>
<body>
  <div class="lista">
    <div class="cartao">
      <div class="etiquetas"><span>css</span></div>
      <p>Texto curto.</p>
      <button>Ler mais</button>
    </div>
    <div class="cartao">
      <div class="etiquetas"><span>css</span><span>web</span></div>
      <p>Um texto médio que ocupa um pouco mais de espaço.</p>
      <button>Ler mais</button>
    </div>
    <div class="cartao">
      <div class="etiquetas"><span>css</span><span>web</span><span>flex</span></div>
      <p>Um texto bem mais longo para mostrar que todos os cartões ficam com a mesma altura.</p>
      <button>Ler mais</button>
    </div>
  </div>
</body>
</html>
