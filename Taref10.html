<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria com efeito</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #0b1230; }
  .galeria { display: flex; gap: 16px; justify-content: center; }
  figure { position: relative; margin: 0; width: 220px; height: 300px;
    overflow: hidden; border-radius: 12px; }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .5s ease-in-out; }
  figure:hover img { transform: scale(1.12); }
  figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px;
    color: #fff; background: rgba(0,0,0,.6);
    transform: translateY(100%); opacity: 0;
    transition: transform .4s ease-in-out, opacity .4s ease-in-out; }
  figure:hover figcaption { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>
  <div class="galeria">
    <figure>
      <img src="https://picsum.photos/seed/a/440/600" alt="">
      <figcaption>Legenda da foto</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/seed/b/440/600" alt="">
      <figcaption>Legenda da foto</figcaption>
    </figure>
  </div>
</body>
</html>
