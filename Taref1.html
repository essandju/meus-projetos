<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão de perfil</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f3f4f6; }
  .card { max-width: 360px; margin: auto; background: #fff; border-radius: 16px; padding: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
    box-shadow: 0 4px 16px #0002; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: #6366f1; }
  h1, p { margin: 0; }
  .botoes { display: flex; gap: 12px; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; cursor: pointer; }
  .stats { display: flex; width: 100%; gap: 8px; }
  .stats div { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .stats b { font-size: 1.3rem; }
  .stats span { font-size: .75rem; color: #666; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar"></div>
    <h1>Ana Silva</h1>
    <p>Designer e criadora de interfaces</p>
    <div class="botoes"><button>Seguir</button><button>Mensagem</button></div>
    <div class="stats">
      <div><b>1.2k</b><span>seguidores</span></div>
      <div><b>340</b><span>a seguir</span></div>
      <div><b>87</b><span>publicações</span></div>
    </div>
  </div>
</body>
</html>
